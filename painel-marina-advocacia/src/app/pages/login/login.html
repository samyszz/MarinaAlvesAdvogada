<section class="relative min-h-screen flex items-center justify-center overflow-hidden bg-black">
  
  <div class="absolute inset-0 z-0 pointer-events-none">
    <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=2000&auto=format&fit=crop" 
         class="w-full h-full object-cover opacity-20 grayscale brightness-50" alt="Background" />
    <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-champagne/10 rounded-full blur-[120px] mix-blend-screen"></div>
  </div>

  <div class="relative z-10 w-full max-w-md px-6 animate-fade-in">
    <div class="glass p-10 rounded-sm shadow-2xl">
      
      <div class="text-center mb-10 space-y-2">
        <div class="w-12 h-12 mx-auto flex items-center justify-center rounded-sm bg-white/5 border border-white/10 mb-4 shadow-lg">
          <span class="font-serif italic text-lg text-champagne">M</span>
        </div>
        <h1 class="text-2xl font-light tracking-widest text-white uppercase">Área Restrita</h1>
        <p class="text-[10px] uppercase tracking-[0.2em] text-white/50">Gestão de Conteúdo</p>
      </div>

      <form [formGroup]="formLogin" (ngSubmit)="onLogin()" class="space-y-6">
        
        <div class="space-y-2">
          <label class="text-[10px] uppercase tracking-widest text-white/60 font-light">E-mail de Acesso</label>
          <input type="email" formControlName="email" class="w-full bg-black/50 border border-white/10 rounded-sm px-4 py-3 text-sm text-white focus:outline-none focus:border-champagne/60 transition-colors" placeholder="admin@marinaalves.adv.br">
        </div>

        <div class="space-y-2">
          <label class="text-[10px] uppercase tracking-widest text-white/60 font-light">Senha</label>
          <input type="password" formControlName="senha" class="w-full bg-black/50 border border-white/10 rounded-sm px-4 py-3 text-sm text-white focus:outline-none focus:border-champagne/60 transition-colors" placeholder="••••••••">
        </div>

        <div *ngIf="erroLogin" class="p-3 bg-red-500/10 border border-red-500/30 text-red-400 text-[10px] tracking-wider uppercase rounded-sm text-center">
          Credenciais inválidas. Tente novamente.
        </div>

        <button type="submit" [disabled]="formLogin.invalid || carregando" class="w-full py-4 bg-gradient-to-r from-dourado to-champagne text-black text-xs font-semibold uppercase tracking-widest rounded-sm hover:brightness-110 transition-all duration-300 disabled:opacity-50 mt-4 shadow-[0_0_20px_rgba(185,153,97,0.2)] hover:-translate-y-1">
          {{ carregando ? 'Autenticando...' : 'Entrar no Sistema' }}
        </button>
      </form>
    </div>
  </div>
</section>
